global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-service
    static_configs:
      - targets: [ "host.docker.internal:5242"]
    metrics_path: /metrics

  - job_name: bookings-service
    static_configs:
      - targets: [ "host.docker.internal:5265"]
    metrics_path: /metrics

  - job_name: users-service
    static_configs:
      - targets: ["host.docker.internal:5293"]
    metrics_path: /metrics
